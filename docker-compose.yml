services:
  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    container_name: text_stoty_ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: text_stoty_ai123
      MYSQL_DATABASE: text_stoty_ai
      MYSQL_ROOT_HOST: "%"
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--sql_mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ptext_stoty_ai123"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: text_stoty_ai-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # ==================== MinIO ====================
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: text_stoty_ai-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ==================== App (Next.js + Workers) ====================
  app:
    image: ghcr.io/tysdz/text_stoty_ai:latest
    container_name: text_stoty_ai-app
    restart: unless-stopped
    environment:
      # localized text（localized text MySQL，localized text mysql localized text localhost）
      DATABASE_URL: "mysql://root:text_stoty_ai123@mysql:3306/text_stoty_ai"
      # Redis（localized text Redis，localized text redis）
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ""
      REDIS_TLS: ""
      # localized text：Default MinIO（S3 localized text）
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_REGION: "us-east-1"
      MINIO_BUCKET: "text_stoty_ai"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_FORCE_PATH_STYLE: "true"
      # localized text（localized text）
      NEXTAUTH_URL: "http://localhost:13000"
      # localized text（localized text fetch localized text API / localized text）
      INTERNAL_APP_URL: "http://127.0.0.1:3000"
      NEXTAUTH_SECRET: "text_stoty_ai-default-secret-2026"
      # localized text
      CRON_SECRET: "text_stoty_ai-docker-cron-secret"
      INTERNAL_TASK_TOKEN: "text_stoty_ai-docker-task-token"
      API_ENCRYPTION_KEY: "text_stoty_ai-opensource-fixed-key-2026"
      # Worker Config
      WATCHDOG_INTERVAL_MS: "30000"
      TASK_HEARTBEAT_TIMEOUT_MS: "90000"
      QUEUE_CONCURRENCY_IMAGE: "50"
      QUEUE_CONCURRENCY_VIDEO: "50"
      QUEUE_CONCURRENCY_VOICE: "20"
      QUEUE_CONCURRENCY_TEXT: "50"
      # Bull Board
      BULL_BOARD_HOST: "0.0.0.0"
      BULL_BOARD_PORT: "3010"
      BULL_BOARD_BASE_PATH: "/admin/queues"
      BULL_BOARD_USER: ""
      BULL_BOARD_PASSWORD: ""
      # localized text
      LOG_UNIFIED_ENABLED: "true"
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
      LOG_DEBUG_ENABLED: "false"
      LOG_AUDIT_ENABLED: "true"
      LOG_SERVICE: "text_stoty_ai"
      LOG_REDACT_KEYS: "password,token,apiKey,apikey,authorization,cookie,secret,access_token,refresh_token"
      # localized text
      BILLING_MODE: "OFF"
      # localized text
      LLM_STREAM_EPHEMERAL_ENABLED: "true"
    ports:
      - "13000:3000"
      - "13010:3010"
    volumes:
      - ./data:/app/data
      - ./docker-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma db push --skip-generate &&
        (sleep 5 && echo '' &&
        echo '╔══════════════════════════════════════════════════╗' &&
        echo '║            text_stoty_ai is ready!                    ║' &&
        echo '║                                                  ║' &&
        echo '║  HTTP:  http://localhost:13000                    ║' &&
        echo '║                                                  ║' &&
        echo '║  For HTTPS, run Caddy on host:                   ║' &&
        echo '║  caddy run --config Caddyfile                    ║' &&
        echo '║  Then open: https://localhost:1443                ║' &&
        echo '╚══════════════════════════════════════════════════╝' &&
        echo '') &
        npm run start
      "

volumes:
  mysql_data:
  redis_data:
  minio_data:
